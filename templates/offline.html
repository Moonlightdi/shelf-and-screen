<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0d24">
    <title>Offline · Shelf & Screen</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
               background: radial-gradient(ellipse at top, #20235a, #0b0d24 70%); color: #f4f1ff; font-family: Georgia, serif; text-align: center; }
        .moon { font-size: 64px; color: #f2e8d2; }
        h1 { font-weight: normal; font-size: 30px; margin: 10px 0; }
        p { color: #a9b3d6; line-height: 1.7; max-width: 380px; margin: 0 auto 22px; }
        a { color: #f2e8d2; border: 1px solid #f2e8d2; padding: 8px 18px; border-radius: 999px; text-decoration: none; }
    </style>
</head>
<body>
    <div>
        <div class="moon">☾</div>
        <h1>The library is closed for the night</h1>
        <p>You're offline. Pages you already opened still work, so your shelf and the books you were reading are waiting for you.</p>
        <a href="/">try again</a>
    </div>
</body>
</html>
